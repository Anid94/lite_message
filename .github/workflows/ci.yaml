name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ci_test_password
      POSTGRES_DB: lite_message_test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5433"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: lite_message_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U user -d lite_message_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Run tests
        run: python -m pytest -v